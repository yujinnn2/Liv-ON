 <!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스크롤 이미지 효과</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Pretendard', sans-serif;
      overflow-x: hidden;
    }

    /* 메인 섹션 */
    .scroll-section {
      height: 300vh; /* 긴 스크롤을 위해 3배 높이 */
    }

    /* 고정 컨테이너 */
    .sticky-container {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 텍스트 영역 */
    .text-content {
      position: relative;
      z-index: 10;
      text-align: center;
      color: #fff;
      transition: opacity 0.5s ease;
    }

    .text-content h1 {
      font-size: 5vw;
      margin-bottom: 20px;
    }

    .text-content p {
      font-size: 1.5vw;
    }

    /* 이미지 영역 */
    .image-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .main-image {
      position: absolute;
      bottom: -50%; /* 초기 위치 - 화면 아래에 숨김 */
      left: 0;
      width: 100%;
      height: 150%; /* 이미지 높이 확대 */
      background-size: cover;
      background-position: center;
      transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 다음 섹션 (예시) */
    .next-section {
      height: 100vh;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }
  </style>
</head>
<body>
  <section class="scroll-section">
    <div class="sticky-container">
      <div class="text-content">
        <h1>창의적인 디스플레이 솔루션</h1>
        <p>스크롤을 내려 이미지를 확인하세요</p>
      </div>
      
      <div class="image-container">
        <div class="main-image" style="background-image: url('../Liv-ON/assets/images/tree.png')"></div>
      </div>
    </div>
  </section>

  <section class="next-section">
    <h2>다음 섹션</h2>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const scrollSection = document.querySelector('.scroll-section');
      const stickyContainer = document.querySelector('.sticky-container');
      const textContent = document.querySelector('.text-content');
      const mainImage = document.querySelector('.main-image');

      window.addEventListener('scroll', function() {
        const scrollPosition = window.scrollY;
        const sectionHeight = scrollSection.offsetHeight;
        const windowHeight = window.innerHeight;
        
        // 스크롤 진행도 (0~1)
        const scrollProgress = Math.min(scrollPosition / (sectionHeight - windowHeight), 1);

        // 1단계: 텍스트 페이드아웃 (0~0.3 스크롤)
        if (scrollProgress < 0.3) {
          textContent.style.opacity = 1 - (scrollProgress / 0.3);
        } else {
          textContent.style.opacity = 0;
        }

        // 2단계: 이미지 올라오기 (0.1~0.5 스크롤)
        if (scrollProgress >= 0.1 && scrollProgress <= 0.5) {
          const progress = (scrollProgress - 0.1) / 0.4; // 0~1로 정규화
          mainImage.style.bottom = `${-50 + (progress * 30)}%`; // -50% → -20%로 이동
        }
        
        // 3단계: 이미지 전체 확대 (0.5~1 스크롤)
        if (scrollProgress > 0.5) {
          const progress = (scrollProgress - 0.5) / 0.5; // 0~1로 정규화
          mainImage.style.bottom = `${-20 - (progress * 20)}%`; // -20% → -40%로 이동
          mainImage.style.height = `${150 - (progress * 50)}%`; // 150% → 100%로 축소
        }
      });

      // 초기화
      window.dispatchEvent(new Event('scroll'));
    });
  </script>
</body>
</html>
</body>
</html>
