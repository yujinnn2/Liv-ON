<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .cont{
            width: 30%;
            height: 400px;
            background-color: blue;
            position: relative;
            transition: all 1s;
            overflow: hidden;
        }
        .black-box{
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            transition: all 1s;
            backdrop-filter: blur(2px);
        }

        .text-ani{
            position: absolute;
            bottom: -100px;
            transition: all 1s;
            z-index: 99;
            color: #fff;
        }
        .cont:hover .text-ani{
            bottom: 0;
        }
        .cont:hover .black-box{
            opacity: 1;
        }
</style>
</head>

<body>

    <div class="cont">
        <div class="black-box"></div>
        <div class="text-ani">

            <h1>Lorem, ipsum dolor</h1>
            <p> sit amet consectetur adipisicing elit. Quasi pariatur ipsa quod? Numquam beatae neque explicabo, non
                fuga natus ullam, id omnis quia nulla praesentium odio magnam autem. Similique, voluptates!</p>
        </div>
    </div>
</body>

</html>
