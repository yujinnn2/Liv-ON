<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="assets/css/product.css">
</head>

<body>
    <section class="section01">
        <div class="container">
            <!-- main-title -->
            <div class="row">
                <div class="col-md-12">
                    <h3 class="main_title">Liv;ON Products</h3>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <h4>가상체험관</h4>
                        <p>creative design mind<br>
                            change space & life<br>
                            창의적인 디자인 마인드로 공간과 생활을 바꿉니다.<br>
                            제품이 어떻게 공간에 적용되는지를 한 눈에 보며 직접 체험하고 느낄 수 있습니다.<br></p>
                    </div>
                </div>
                <!-- tab bar -->
                <ul class="tabs">
                    <li class="tab-link current" data-tab="tab-1">Bedroom</li>
                    <li class="tab-link" data-tab="tab-2">Washroom</li>
                    <li class="tab-link" data-tab="tab-3">Diningroom</li>
                    <li class="tab-link" data-tab="tab-4">Livingroom</li>
                </ul>
                <div id="tab-1" class="tab-content current">
                    <!-- tab01 탭1 -->
                    <div class="page01">
                        <!-- 가상체험관 -->
                        <div class="row">
                            <div class="col-md-12">
                                <div class="tab_content">
                                    <div class="tab_bg">
                                        <div class="tab_main">
                                            <img src="assets/images/office.png" alt="">
                                        </div>
                                        <div class="tab_bg_content">
                                            <ul>
                                                <li class="bg bg1"></li>
                                            </ul>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12">
                                            <div class="tab-list">
                                                <div class="tab_01">
                                                    <img src="assets/images/bgBtn_tab_01.jpg" alt="">
                                                </div>
                                                <div class="tab_02">
                                                    <img src="assets/images/bgBtn_tab_01.jpg" alt="">
                                                </div>
                                                <div class="tab_03">
                                                    <img src="assets/images/bgBtn_tab_01.jpg" alt="">
                                                </div>
                                                <div class="tab_04">
                                                    <img src="assets/images/bgBtn_tab_01.jpg" alt="">
                                                </div>
                                                <div class="tab_05">
                                                    <img src="assets/images/bgBtn_tab_01.jpg" alt="">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- jeqeury -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollSmoother.min.js"></script>
    <!-- Bootstrap 5 -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <!-- JS -->
    <script>
        $(document).ready(function () {

            $('ul.tabs li').click(function () {
                let tab_id = $(this).attr('data-tab');

                $('ul.tabs li').removeClass('current');
                $('.tab-content').removeClass('current');

                $(this).addClass('current');
                $("#" + tab_id).addClass('current');
            })

        })
        $(function () {
            $('.tab_01').click(function () {
                $('.bg').addClass('bg1');
                $('.bg').removeClass('bg2');
                $('.bg').removeClass('bg3');
                $('.bg').removeClass('bg4');
                $('.bg').removeClass('bg5');
            })
            $('.tab_02').click(function () {
                $('.bg').addClass('bg2');
                $('.bg').removeClass('bg1');
                $('.bg').removeClass('bg3');
                $('.bg').removeClass('bg4');
                $('.bg').removeClass('bg5');
            })
            $('.tab_03').click(function () {
                $('.bg').addClass('bg3');
                $('.bg').removeClass('bg1');
                $('.bg').removeClass('bg2');
                $('.bg').removeClass('bg4');
                $('.bg').removeClass('bg5');
            })
            $('.tab_04').click(function () {
                $('.bg').addClass('bg4');
                $('.bg').removeClass('bg1');
                $('.bg').removeClass('bg2');
                $('.bg').removeClass('bg3');
                $('.bg').removeClass('bg5');
            })
            $('.tab_05').click(function () {
                $('.bg').addClass('bg5');
                $('.bg').removeClass('bg1');
                $('.bg').removeClass('bg2');
                $('.bg').removeClass('bg3');
                $('.bg').removeClass('bg4');
            })

        })




    </script>

</body>

</html>
