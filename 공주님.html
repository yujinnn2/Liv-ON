<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .tab-content{
            display: none;
            &.active{
                display: block;
            }
        }
    </style>
</head>
<body>
    <section class="section01">
        <div class="container">
            <div class="row tab-list">
                <div class="col-3">
                    <div class="tab-icon active text-center" data-tab="tab_Bedroom"> aaaa
                    </div>
                </div>
                <div class="col-3">
                    <div class="tab-icon" data-tab="tab_Livingroom">
aaa
                    </div>
                <div class="col-3">
                    <div class="tab-icon" data-tab="tab_Bathroom">
aa
                    </div>
                <div class="col-3">
                    <div class="tab-icon" data-tab="tab_Diningroom">
aa
                    </div>
                </div>
            </div>
        </div>

        <div class="container tab-content" id="tab_Bedroom">
            <div class="row">
                <div class="col-md-12">
                    
                </div>
            </div>
        </div>
        <div class="container tab-content" id="tab_Livingroom">
            <div class="row">
                <div class="col-md-12">

                </div>
            </div>
        </div>
        <div class="container tab-content" id="tab_Bathroom">
            <div class="row">
                <div class="col-md-12">

                </div>
            </div>
        </div>
        <div class="container tab-content" id="tab_Diningroom">
            <div class="row">
                <div class="col-md-12">

                </div>
            </div>
        </div>

    </section>

      <!-- jeqeury -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

  <script>
    $(document).ready(function(){
        $('.tab-icon').click(function(e){
            e.preventDefault();

            let current = $(this).attr('data-tab');

            $('.tab-icon').removeClass('active');
            $('.tab-content').hide(); 

            $(this).addClass('active');
            $('#' + current).fadeIn(500);
        });
    });
  </script>
</body>
</html>
