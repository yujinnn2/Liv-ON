<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .fixed-section {
            top: 0%;
            left: 0;
            width: 100%;
            height: 50vh;
            /* display: flex; */
            justify-content: center;
            align-items: center;
            background: #fff;
            /* 원하는 배경색 */
        }

        .changing-text {
            position: relative;
            font-size: 5vw;
            font-weight: bold;
            text-align: center;
        }

        .text-block {
            position: absolute;
            transform: translate(50%, 100%);
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .text-block.active {
            opacity: 1;
        }

        .scroll-space {
            height: 50vh;
            /* 텍스트 블록 개수에 따라 조정 (예: 4개 × 100vh = 400vh) */
        }
    </style>
</head>

<div class="fixed-section">
    <div class="changing-text">
        <div class="text-block active">상상만 했던 나만의 완벽한 집, </div>
        <div class="text-block">Liv;ON이 현실로 만듭니다.</div>
    </div>
</div>

<!-- 스크롤을 위해 빈 공간 추가 -->
<div class="scroll-space"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const textBlocks = document.querySelectorAll('.text-block');
        let currentIndex = 0;

        // 스크롤 이벤트 감지
        window.addEventListener('wheel', (e) => {
            e.preventDefault(); // 기본 스크롤 방지 (선택적)

            // 스크롤 방향에 따라 인덱스 변경
            if (e.deltaY > 0) {
                currentIndex = Math.min(currentIndex + 1, textBlocks.length - 1);
            } else {
                currentIndex = Math.max(currentIndex - 1, 0);
            }

            // 모든 텍스트 비활성화 후 현재 텍스트만 활성화
            textBlocks.forEach(block => block.classList.remove('active'));
            textBlocks[currentIndex].classList.add('active');
        });
    });
</script>
</body>

</html>
</body>

</html>
