<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>


        *{
            margin: 0;
            padding: 0;
        }
        .container{
            width: 100%;
            height: 1500px;
        }
        #header{
            position: fixed;
            width: 100%;
            box-sizing: border-box;
            background-color: #e1e1e1;
            transition: .5s;
        }
        #header nav{
            top:0;
            left: 0;
            width: 100%;
            max-width: 1460px;
            margin: 0 auto;
        }
        #header nav .logo{
            float: left;
            padding: 30px 0;
            height: 22px;
        }
        #header nav ul{
            float: right;
            margin: 0;
            padding: 30px 0;
        }
        #header2 ul li{
            float: left;
            display: block;
            list-style: none;
        }
        #header nav ul li{
            padding: 0 15px;
            line-height: 22px;
            text-decoration: none;
            color: #262626;
            font-size: 16px;
        }
        #header nav ul li:hover a{
            text-decoration: underline;
        }
        #header nav ul li a{
            transition: all .8s;

        }
        /* 스크롤 되었을 때 */

        #header.active{
            background: rgba(0,0,0,.8);
        }
        #header.active nav .logo, #header.active nav ul{
            padding: 20px 0;
            transition: all .5s;
        }
        #header.active nav ul li a{
            color: #fff;
            font-size: 14px;
        }

    </style>
</head>
