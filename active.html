<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .act__btn_01{
            width: 20px;
            height: 20px;
            background: rgba(255,255,255,1);
            position: absolute;
            top: 200px;
            border-radius: 100px;
            left: 300px;
            cursor: pointer;
        }
        img{
            width: 100%;
        }
        .active_content{
            position: relative;
        }
        .act__text_01{
            position: absolute;
            background: #fff;
            top: 150px;
            width: 10%;
            left: 320px;
            display: none;
        }
        ul{
            padding: 0;
        }
        .tab-list img{
            width: 20%;
            height: 100px;
        }
        .tab_bg_content{
            position: absolute;
            z-index:-1;
            top: 0;
            width: 100%;
            
            height: auto;
        }
        .bg1{
            width: 100%;
            background-color: blanchedalmond;
            height: 100vh;
        }
        .bg2{
            width: 100%;
            background-color: burlywood;
            height: 100vh;
        }
        .bg3{
            width: 100%;
            background-color: antiquewhite;
            height: 100vh;
        }
        .tab_bg{
            position: relative;
        }
        .tab-list{
            display: flex;
        }
        .tab-list div{
            width: 30%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    
    <div class="active_content">
        <div class="active__img">
            <img src="assets/images/forest.png" alt="">
        </div>
        <div class="acvtive_btn">
            <div class="act__btn_01"></div>
        </div>
        <div class="act__text_01">
            <p>나무</p>
            <a href="https://naver.com" target="_blank">구매하기</a>
        </div>
    </div>
<!-- 가상체험관 -->
    <div class="container">
        <div class="tab_content">
        <div class="tab_bg">
            <div class="tab_main">
                    <img src="assets/images/office.png" alt="">
            </div>
            <div class="tab_bg_content">
                <ul>
                    <li class="bg bg1"></li>
                </ul>
            </div>
        </div>
        <div class="tab-list">
            <div class="tab_01">
                <img src="assets/images/bgBtn_tab_01.jpg" alt="">
            </div>
            <div class="tab_02">
                <img src="assets/images/bgBtn_tab_01.jpg" alt="">
            </div>
            <div class="tab_03">
                <img src="assets/images/bgBtn_tab_01.jpg" alt="">
            </div>
        </div>
    </div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js">
    </script>
      <!-- Bootstrap 5 -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>

    <script>
        $(function(){
            $('.act__btn_01').click(function(){
                $('.act__text_01').toggle();
            })
            $('.tab_01').click(function(){
                $('.bg').addClass('bg1');
                $('.bg').removeClass('bg2');
                $('.bg').removeClass('bg3');
            })
            $('.tab_02').click(function(){
                $('.bg').addClass('bg2');
                $('.bg').removeClass('bg1');
                $('.bg').removeClass('bg3');
            })
            $('.tab_03').click(function(){
                $('.bg').addClass('bg3');
                $('.bg').removeClass('bg1');
                $('.bg').removeClass('bg2');
            })

        })
    </script>

</body>
</html>
